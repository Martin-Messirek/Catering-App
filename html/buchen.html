    <!--Datum, Uhrzeit, Personenzahl, Serviceart und Veranstaltungsort. 
    
    
    Der Kunde gibt zunächst auf der Buchungsseite die Veranstaltungsdaten ein. 
    
    Nach Auswahl der Serviceart und Übermittlung der Angaben gelangt er zur Bestellseite. Dort wählt er die gewünschten Gerichte und Komponenten aus.
    
    Die Bestellseite bietet beispielsweise drei Dropdown-Felder für Hauptgerichte und zwei Beilagen sowie zusätzliche Checkboxen für Salate, weitere Beilagen und Hauptkomponenten wie Fleisch. Die genaue Auswahl und Darstellung kann abhängig von der gewählten Serviceart variieren.
    
    Für die erste Version wird pro Bestellung genau eine Serviceart gewählt: Buffet, Flying Buffet oder Tellerservice.-->
